name: Fetch Research Data

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers, e.g. 02255.HK,600519.SS,9988.HK'
        required: true
        type: string
  push:
    branches: [dsh/work]
    paths:
      - research_fetch_trigger.json

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests pandas -q

      - name: Resolve tickers
        id: tickers
        env:
          INPUT_TICKERS: ${{ inputs.tickers }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tickers = os.environ.get("INPUT_TICKERS", "")
          trigger = Path("research_fetch_trigger.json")
          if not tickers and trigger.is_file():
              tickers = ",".join(json.loads(trigger.read_text(encoding="utf-8")).get("tickers", []))
          if "\r" in tickers or "\n" in tickers:
              raise SystemExit("Tickers must be a single comma-separated line.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"list={tickers}", file=output)
          PY

      - name: Fetch financial data
        id: fetch_data
        env:
          TICKERS: ${{ steps.tickers.outputs.list }}
        run: python3 scripts/fetch_research_data.py "$TICKERS"

      - name: Commit cache
        if: ${{ !cancelled() && (steps.fetch_data.outcome == 'success' || steps.fetch_data.outcome == 'failure') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research_cache/
          git diff --cached --quiet && echo "nothing to commit" || \
            git commit -m "chore: update research cache $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin main || true
          git push
