name: Fetch Ad-hoc Option Chain

# 单标的、指定到期日的期权链（scripts/fetch_chain_adhoc.py）。不影响每日扫描的 options_watch.json。
on:
  push:
    branches: [claude/install-claude-hud-d51E6]
    paths: [chain_request.json]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests -q
      - run: python3 scripts/fetch_chain_adhoc.py
      - name: Commit chains
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chains/
          git diff --cached --quiet && echo "nothing to commit" || git commit -m "chore: fetch ad-hoc chain [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "$GITHUB_REF_NAME" || { echo "::error::rebase 失败"; exit 1; }
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((i * 3))
          done
          exit 1
