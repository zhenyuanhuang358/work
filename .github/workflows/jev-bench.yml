name: Jev 归因基准

# 为什么必须在 Actions 里跑，而不是在会话容器里：
#   会话容器对 api.typesafe.ai 和 classifier.dev 一律
#   CONNECT tunnel failed 403（组织代理策略）。按 /root/.ccr/README.md
#   这类拒绝只报告不绕过。Actions runner 出网不受该策略约束，是唯一可行路径。
#
# 两条后端，口径**不同**，不得混为一谈：
#   A. classifier.dev —— 不要 key，今天就能跑。但测的是**服务**，
#      中间隔着它的 prompt、分块和降级到 LLM 链的 fallback。
#   B. Jev 官方 API —— 测的是**裸模型**，需要 TYPESAFE_API_KEY。
#   两者都跑，差值就是「那层壳值多少」。该项目自己的 vs_jev.py 存在的理由
#   正是要分开这两件事（AG News 上 87.5% 直连 vs 87.2% 过壳）。

on:
  # ⚠ 为什么不只有 workflow_dispatch：本会话的集成 token 没有 actions:write，
  #   `actions_run_trigger` 返回 403 Resource not accessible by integration，
  #   我**无法从这里 dispatch**，于是 2026-09-20 建好之后一次都没跑起来
  #   （list_workflow_runs total_count = 0）。
  #   仓库里早有现成解法：fetch-prices.yml 靠 push 一个 trigger 文件自启动。
  #   照抄它 —— 我 dispatch 不了，但我能 push。
  push:
    branches: [claude/install-claude-hud-d51E6]
    paths:
      - jev_bench_trigger.txt
  workflow_dispatch:
    inputs:
      backend:
        description: "跑哪条后端"
        type: choice
        options: ["classifier.dev", "jev-direct", "both"]
        default: "classifier.dev"
      tier:
        description: "classifier.dev 档位（fast 免费无限 / smart 公开配额 200 decisions，164 例刚好装得下）"
        type: choice
        options: ["fast", "smart", "both"]
        default: "fast"

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 基准集由 git 历史重建，浅克隆会少掉大部分交易日

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 重建基准集（离线，不用 key）
        run: |
          python3 tools/jev_bench.py --build
          python3 tools/jev_bench.py --stats | tee bench_stats.txt

      - name: 信息隔离闸 —— 同业代码进入文本即作废
        run: python3 tools/jev_bench.py --isolation

      - name: 基准集必须与提交版一致 —— 不一致说明答案键或数据变了
        run: |
          # 答案键是实验的地基。若 Actions 里重建出的集合与仓库里提交的那份不同，
          # 说明常数被改过或抓价历史变了 —— 此时任何分数都不可比，直接停。
          if ! git diff --quiet -- memory/state/jev_bench_set.json; then
            echo "::warning::重建出的基准集与提交版不一致："
            git diff --stat -- memory/state/jev_bench_set.json
            python3 - <<'PY'
          import json, subprocess
          old = json.loads(subprocess.run(
              ["git","show","HEAD:memory/state/jev_bench_set.json"],
              capture_output=True, text=True).stdout)
          new = json.load(open("memory/state/jev_bench_set.json"))
          if old["key_constants"] != new["key_constants"]:
              raise SystemExit(f"::error::答案键常数被改动 "
                               f"{old['key_constants']} → {new['key_constants']}，"
                               f"这会让新旧分数不可比。停。")
          print(f"常数未变；例数 {old['n_cases']} → {new['n_cases']}"
                f"（抓价历史增长导致，可接受）")
          PY
          fi

      # ── 后端 A：classifier.dev（无需任何 secret）──────────────────────────
      - name: 调 classifier.dev
        # push 触发时 inputs 为空 → 默认跑 classifier.dev（它不需要任何 secret）
        if: github.event_name == 'push' || inputs.backend == 'classifier.dev' || inputs.backend == 'both'
        run: |
          set -o pipefail
          tiers="${{ inputs.tier || 'both' }}"
          [ "$tiers" = "both" ] && tiers="fast smart"
          for tier in $tiers; do
            echo "::group::classifier.dev $tier"
            python3 tools/jev_bench.py --run-classifier "$tier" > "resp_cls_$tier.json" \
              || { echo "::error::classifier.dev $tier 调用失败"; continue; }
            python3 tools/jev_bench.py --score "resp_cls_$tier.json" \
              | tee "score_cls_$tier.txt"
            echo "::endgroup::"
          done

      # ── 后端 B：Jev 官方 API（需要 secret）────────────────────────────────
      - name: 调 Jev 官方 API
        if: inputs.backend == 'jev-direct' || inputs.backend == 'both'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::warning::secret TYPESAFE_API_KEY 未配置，跳过裸模型这条。"
            echo "::warning::获取：typesafe.ai 排队 → console.typesafe.ai/settings/keys"
            echo "::warning::→ Settings > Secrets and variables > Actions > New repository secret"
            exit 0
          fi
          python3 tools/jev_bench.py --run > resp_jev.json || true
          python3 - <<'PY'
          import json, sys
          r = json.load(open("resp_jev.json"))
          bad = [x for x in r if "error" in x]
          print(f"应答 {len(r)} 例，出错 {len(bad)}")
          for x in bad[:3]:
              print(" ", x["case_id"], x.get("error"), str(x.get("body"))[:200])
          if len(bad) == len(r):
              sys.exit("::error::全部请求失败 —— 多半是 schema 或鉴权不对，"
                       "不是模型表现差。先拿官方文档核 build_requests() 的字段名。")
          PY
          python3 tools/jev_bench.py --score resp_jev.json | tee score_jev.txt

      - name: 汇总到 Step Summary
        if: always()
        run: |
          {
            echo "## Jev 归因基准"
            echo '```'
            cat bench_stats.txt 2>/dev/null
            echo '```'
            for f in score_cls_*.txt score_jev.txt; do
              [ -f "$f" ] || continue
              echo "### $f"
              echo '```'
              cat "$f"
              echo '```'
            done
            echo "> ⚠ classifier.dev 的分数是**服务**的分数，不是 Jev 裸模型的分数。"
            echo "> 两者之间隔着它的 prompt、分块和 LLM fallback 链。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jev-bench-${{ github.run_number }}
          path: |
            bench_stats.txt
            score_*.txt
            resp_*.json
            memory/state/jev_bench_set.json
