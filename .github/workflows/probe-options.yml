name: Probe Options Sources

# 一次性最小验证（2026-10-29）：比较 yfinance 与 CBOE 延迟报价两个免费期权链源。
# 不改 stock_prices.json，只写 options_probe.json。选定数据源后本工作流删除。
on:
  push:
    branches: [claude/install-claude-hud-d51E6]
    paths:
      - options_probe_trigger.txt
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance requests -q
      - run: python3 scripts/probe_options.py
      - name: Commit options_probe.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add options_probe.json
          git diff --cached --quiet && echo "nothing to commit" || \
            git commit -m "chore: options probe $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" \
            || { echo "::error::git pull --rebase 失败"; exit 1; }
          git push origin "HEAD:$GITHUB_REF_NAME"
