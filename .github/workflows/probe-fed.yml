name: Probe Fed Speech Sources
# 一次性最小验证（2026-11-05）：美联储讲话数据源。验证完删除。
on:
  push:
    branches: [claude/install-claude-hud-d51E6]
    paths: [scripts/probe_fed.py]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q && python3 scripts/probe_fed.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fed_probe.json && git commit -m "chore: fed probe [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep $((i*3)); done; exit 1
